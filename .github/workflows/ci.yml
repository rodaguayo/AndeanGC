name: CI

on:
  push:
    branches: [main]
  pull_request:

# The pipeline itself cannot run here: it needs the external data_root archive
# (DEM, ERA5, RGI, ...) described in the README. CI guards the code around it —
# the helper modules, their tests, and that notebooks are committed clean.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: dev
          cache: true

      - name: Lint
        run: pixi run -e dev lint

      - name: Tests
        run: pixi run -e dev test

      # Safety net for anyone who has not run `pixi run -e dev install-hooks`,
      # which strips outputs on commit via the nbstripout git filter.
      - name: Notebooks committed without outputs
        run: pixi run -e dev check-notebooks
