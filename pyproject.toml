[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "andeangc"
version = "1.0.0"
description = "Andean Glacierized Catchment dataset: a unified streamflow dataset for glacierized basins across the Andes"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Rodrigo Aguayo", email = "rodrigo.aguayo@kuleuven.be" },
]
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "geopandas",
    "shapely",
    "rasterio",
    "rioxarray",
    "xarray",
    "geocube",
    "whitebox",
    "saqc",
    "exactextract",
    "xagg",
    "tqdm",
    "plotly",
    "ipywidgets",
    "openpyxl",
    "pyarrow",
    "pyyaml",
]

[project.optional-dependencies]
viz = ["xrspatial", "scikit-learn", "matplotlib"]
dev = ["jupyter", "nbformat", "pytest"]

[project.urls]
Homepage = "https://github.com/rodaguayo/AndeanGC"
Repository = "https://github.com/rodaguayo/AndeanGC"
DOI = "https://doi.org/10.5281/zenodo.18035801"

[tool.setuptools.packages.find]
include = ["utils*"]
