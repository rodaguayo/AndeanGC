version: "v1.0"
date: "2026"
doi: "10.5281/zenodo.18035801"
citation: "Aguayo, R. Andean Glacierized Catchment (Andean-GC) dataset (2026)."

dataset:
  name: "Andean-GC"
  description: "Comprehensive streamflow dataset for glacierized basins across the Andes mountains"
  region:
    lon: [-80, -65]
    lat: [-55, -5]
  period:
    q: [1950, 2024]
    climate_hist: [1960, 2024]

variables:
  streamflow:
    - name: Q
      long_name: Daily streamflow
      unit: m³/s
      sources:
        - CAMELS-CL (Chile)
        - PMET-obs (Patagonia)
        - SNIH (Argentina)
        - SENAMHI (Peru)
      n_stations: ~200
      period: [1950, 2024]
  climate_historical:
    - name: prcp
      long_name: Precipitation
      product: ERA5
      unit: mm/d
      period: [1960, 2024]
    - name: tasmax
      long_name: Daily maximum near-surface air temperature
      product: ERA5
      unit: °C
      period: [1960, 2024]
    - name: tasmin
      long_name: Daily minimum near-surface air temperature
      product: ERA5
      unit: °C
      period: [1960, 2024]
    - name: tas
      long_name: Daily mean near-surface air temperature
      product: ERA5
      unit: °C
      period: [1960, 2024]
    - name: ep
      long_name: Potential evapotranspiration
      product: ERA5
      unit: mm/d
      period: [1960, 2024]
basin_attributes:
  topography:
    - elevation (mean, median, std)
    - slope (mean)
    - aspect (mean)
    - area
    - perimeter
    - Gravelius compactness index
  climate:
    - mean precipitation
    - precipitation concentration index
    - evapotranspiration
    - aridity index
    - solid precipitation fraction
    - low/high precipitation frequency
  glacier:
    - glacier coverage (RGI v6.0)
    - surface elevation change rate (Hugonnet et al. 2021)
    - ice volume (Millan et al. 2022, Farinotti et al. 2019)
  land_cover:
    - forest
    - shrubs
    - herbaceous
    - cropland
    - urban
    - sparse vegetation
    - water
  infrastructure:
    - dam count (>100 hm³)

sources:
  streamflow:
    - name: CAMELS-CL
      region: Chile (< 40° S)
      provider: DGA Chile
      doi: 10.5194/hess-22-5817-2018
    - name: PMET-obs
      region: Patagonia (> 40° S)
      provider: DGA Chile / various
      doi: 10.1038/s41597-023-02828-2
    - name: SNIH
      region: Argentina
      provider: SNIH Argentina
      url: http://snih.hidricosargentina.gob.ar/
    - name: SENAMHI
      region: Peru
      provider: SENAMHI Peru
      url: https://snirh.ana.gob.pe/ANDREA/Inicio.aspx
  glacier:
    - name: RGI v6.0
      description: Randolph Glacier Inventory
    - name: Hugonnet et al. 2021
      description: Glacier elevation change rates (dhdt)
    - name: Millan et al. 2022
      description: Ice volume distribution
    - name: Farinotti et al. 2019
      description: Ice thickness
  topography:
    name: FABDEM
    based_on: COPDEM
    resolution: 90 m
  climate_reanalysis:
    name: ERA5
    provider: ECMWF/Copernicus
    resolution: 0.25°
  climate_projections:
    name: CMIP6
    provider: various
    scenarios: [SSP1-2.6, SSP2-4.5, SSP3-7.0, SSP5-8.5]
  land_cover:
    name: CGLOPS-1
    year: 2019
    based_on: PROBA-V

pipeline:
  preprocessing:
    - "Standardize gauge IDs and metadata across institutions"
    - "Parse raw SENAMHI Excel files (ANA format)"
    - "Merge historical data with recent DGA records (Chile)"
    - "Concatenate ~82 Argentine SNIH Excel files"
  basin_delineation:
    dem: FABDEM 90 m
    tool: WhiteboxTools
    steps:
      - "Flow accumulation and depression filling"
      - "Flow direction"
      - "Stream extraction and pour-point snapping"
      - "Raster-to-vector conversion (geocube)"
  filtering:
    glacier_threshold: 0.1%
    min_data_length: 365 days
    intervention_keywords: [dam, canal, reservoir, diversion]
  quality_control:
    tool: saqc
    methods:
      - "Constant value flagging"
      - "Range outlier detection"
      - "Isolated value flagging"
    manual_review: true
    stations_removed: 18

outputs:
  naming_convention: "AndeanGC_{type}_{period}[_qc].{csv|gpkg}"
  files:
    timeseries: AndeanGC_data_1950_2024.csv
    timeseries_qc: AndeanGC_data_1950_2024_qc.csv
    metadata: AndeanGC_metadata.csv
    geometry: AndeanGC_shape.gpkg
  climate_historical:
    - AndeanGC_prcp_ERA5_1960_2024.parquet
    - AndeanGC_tasmax_ERA5_1960_2024.parquet
    - AndeanGC_tasmin_ERA5_1960_2024.parquet
    - AndeanGC_tas_ERA5_1960_2024.parquet
    - AndeanGC_ep_ERA5_1960_2024.parquet
